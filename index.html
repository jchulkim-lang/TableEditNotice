<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVN 테이블 편집 보드</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
 :root{--bg:#0f1115;--panel:#181b22;--panel2:#1f232c;--line:#2b303b;--ink:#e7eaf0;
  --muted:#9aa3b2;--accent:#ffe94a;--accent-ink:#3a2f00;--free:#37d399;--busy:#ff6b6b;--me:#5b8cff;}
 *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;font-size:14px}
 .wrap{max-width:none;margin:0 auto;padding:18px 24px}
 h1{font-size:19px;margin:0 0 4px} .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
 .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
 .bar label{color:var(--muted)} input{background:var(--panel2);color:var(--ink);
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
 .pill{font-size:12px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);
  border-radius:999px;padding:4px 10px}
 .tag-admin{color:var(--accent);border-color:rgba(255,233,74,.4)}
 .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
 .row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
 .row:last-child{border-bottom:none}
 .tname{flex:1;min-width:0} .tname .f{font-weight:700;font-size:15px;letter-spacing:.2px} .tname .m{font-size:12px;color:var(--muted);margin-top:2px}
 .fn{color:#7cc4ff} .ext{color:var(--muted);font-weight:400} .dir{color:#8b93a3;font-weight:400;font-size:12px}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
 .cell{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
 .cell.mine{border-color:rgba(91,140,255,.5)} .cell.busy{border-color:rgba(255,107,107,.4)}
 .cell .top{display:flex;align-items:center;gap:6px}
 .cell .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;font-size:14px}
 .cell .bot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
 .badge-sm{font-size:11px;font-weight:700;padding:3px 7px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
 .btn-sm{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:7px;padding:5px 11px;font-size:12px;cursor:pointer;white-space:nowrap}
 .btn-sm:hover{border-color:#3a4150} .btn-sm.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
 .summary{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px}
 .s-title{color:var(--muted);font-size:13px;font-weight:600;margin-right:4px}
 .s-empty{color:var(--muted);font-size:13px}
 .s-chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;color:var(--busy);background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.35)}
 .s-chip.me{color:var(--me);background:rgba(91,140,255,.14);border-color:rgba(91,140,255,.4)}
 .s-file{color:var(--muted);font-weight:400;margin-left:2px}
 .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
 .tab{padding:8px 18px;border:1px solid var(--line);background:var(--panel);border-radius:10px;cursor:pointer;color:var(--muted);font-weight:700;font-size:14px}
 .tab:hover{border-color:#3a4150} .tab.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
 .tab-div{width:1px;align-self:stretch;background:var(--line);margin:0 8px}
 .tab.dept{color:#9db4ff;border-color:rgba(91,140,255,.35);background:rgba(91,140,255,.07)}
 .tab.dept:hover{border-color:var(--me)}
 .tab.dept.active{background:var(--me);color:#fff;border-color:var(--me)}
 .addcard{display:flex;align-items:center;justify-content:center;min-height:66px;cursor:pointer;border-style:dashed;color:var(--muted)}
 .addcard:hover{border-color:var(--accent);color:var(--accent)} .addcard .plus{font-size:32px;font-weight:700;line-height:1}
 .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:60}
 .modal.show{display:grid}
 .modal-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(560px,94vw);max-height:82vh;display:flex;flex-direction:column;overflow:hidden}
 .modal-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
 .modal-head h2{font-size:15px;margin:0} .modal-list{overflow:auto;padding:6px 8px}
 .pick{display:flex;align-items:center;gap:10px;padding:8px 8px;border-bottom:1px solid var(--line)}
 .pick:last-child{border-bottom:none} .pick .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;font-size:14px}
 .pick .src{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
 .badge{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
 .b-free{color:var(--free);background:rgba(55,211,153,.12);border:1px solid rgba(55,211,153,.35)}
 .b-busy{color:var(--busy);background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.35)}
 .b-me{color:var(--me);background:rgba(91,140,255,.14);border:1px solid rgba(91,140,255,.4)}
 .btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:8px;
  padding:7px 12px;font-size:13px;cursor:pointer} .btn:hover{border-color:#3a4150}
 .btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
 .btn-x{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;padding:4px 8px}
 .btn-x:hover{color:var(--busy)}
 .btn:disabled{opacity:.4;cursor:not-allowed}
 .toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:#2a1416;
  border:1px solid var(--busy);color:#ffd7d7;padding:13px 18px;border-radius:12px;max-width:520px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:50;display:none}
 .toast.show{display:block} .foot{color:var(--muted);font-size:12px;margin-top:14px;line-height:1.7}
 .center{min-height:70vh;display:grid;place-items:center;text-align:center}
 .login{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:34px 30px;max-width:360px}
 .login h1{margin-bottom:8px} .login p{color:var(--muted);font-size:13px;margin:0 0 20px}
 .who{display:flex;align-items:center;gap:8px}
</style></head><body>
<div class="wrap"><div id="app"></div></div>
<div class="toast" id="toast"></div>
<div class="modal" id="picker"><div class="modal-box">
  <div class="modal-head"><h2 id="pickerTitle">파일 담기</h2>
    <input id="pickerSearch" placeholder="검색…" style="flex:1;min-width:120px" oninput="renderPicker()" autocomplete="off">
    <button class="btn" onclick="closePicker()">닫기</button></div>
  <div class="modal-list" id="pickerList"></div>
</div></div>
<script>
const $=s=>document.querySelector(s);
let ME=null, POLL=null, GROUPS_DATA=[], ACTIVE="plan", SVN_LOADED={}, SEARCH="";
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function fmtName(name){
  name=String(name||"");
  let dir="",file=name; const s=name.lastIndexOf("/");
  if(s>=0){ dir=name.slice(0,s+1); file=name.slice(s+1); }
  let base=file,ext=""; const d=file.lastIndexOf(".");
  if(d>0){ base=file.slice(0,d); ext=file.slice(d); }
  return (dir?`<span class="dir">${esc(dir)}</span>`:"")+`<span class="fn">${esc(base)}</span><span class="ext">${esc(ext)}</span>`;
}
function fmtNameCell(name){ // 격자 셀용: 폴더는 빼고 파일명만(전체경로는 title로)
  name=String(name||""); const s=name.lastIndexOf("/"); const file=s>=0?name.slice(s+1):name;
  let base=file,ext=""; const d=file.lastIndexOf("."); if(d>0){ base=file.slice(0,d); ext=file.slice(d); }
  return `<span class="fn">${esc(base)}</span><span class="ext">${esc(ext)}</span>`;
}
function toast(html){const t=$("#toast");t.innerHTML=html;t.classList.add("show");
  clearTimeout(toast._h);toast._h=setTimeout(()=>t.classList.remove("show"),4600);}

async function boot(){
  const me=await (await fetch("/api/me")).json();
  if(me.authed){ ME=me; renderBoard(); startPoll(); } else { renderLogin(); }
}

/* ---------- 로그인 ---------- */
async function renderLogin(){
  stopPoll();
  const cfg=await (await fetch("/api/public-config")).json();
  $("#app").innerHTML=`<div class="center"><div class="login">
    <h1>SVN 테이블 편집 보드</h1>
    <p>회사 Google 계정으로 로그인하세요.<br>회사 도메인 계정만 접속됩니다.</p>
    <div id="gbtn"></div>
    <div id="gmsg" style="color:var(--busy);font-size:12px;margin-top:12px"></div>
  </div></div>`;
  (function init(){
    if(!window.google||!google.accounts){ return setTimeout(init,300); }
    google.accounts.id.initialize({ client_id: cfg.google_client_id, callback: async (resp)=>{
      const r=await fetch("/api/auth/google",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({credential:resp.credential})});
      const d=await r.json();
      if(d.ok){ boot(); } else { $("#gmsg").textContent=d.error||"로그인 실패"; }
    }});
    google.accounts.id.renderButton($("#gbtn"),{theme:"filled_blue",size:"large",text:"signin_with",shape:"pill"});
  })();
}

/* ---------- 보드 ---------- */
function renderBoard(){
  const adminBadge = ME.is_admin ? `<span class="pill tag-admin">관리자</span>` : "";
  $("#app").innerHTML=`
    <h1>SVN 테이블 편집 보드</h1>
    <div class="sub">누가 어떤 테이블을 쓰는지 실시간으로 표시됩니다. 수정할 때만 <b>사용 시작</b>을 눌러주세요.</div>
    <div class="bar">
      <span class="who"><span class="pill">👤 ${esc(ME.name)} · ${esc(ME.email)}</span>${adminBadge}</span>
      <button class="btn" onclick="logout()">로그아웃</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div id="tab"></div>`;
  refresh();
}
function renderTabs(){
  const el=$("#tabs"); if(!el) return;
  let html="", divAdded=false;
  GROUPS_DATA.forEach(g=>{
    if(g.kind==="dept" && !divAdded){ html+=`<span class="tab-div"></span>`; divAdded=true; }
    const n=g.tables.filter(t=>t.in_use).length;
    const cls="tab"+(g.kind==="dept"?" dept":"")+(g.key===ACTIVE?" active":"");
    const icon = g.kind==="dept" ? "★ " : "";
    html+=`<button class="${cls}" onclick="switchTab('${g.key}')">${icon}${esc(g.label)}${n?` · ${n}`:""}</button>`;
  });
  el.innerHTML=html;
}
function switchTab(k){ ACTIVE=k; SEARCH=""; renderTabs(); renderTabStructure(); renderDynamic(); }
function onSearch(v){ SEARCH=v; renderDynamic(); }

function groupKind(k){ const g=GROUPS_DATA.find(x=>x.key===k); return g?g.kind:'sync'; }
function labelOf(k){ const g=GROUPS_DATA.find(x=>x.key===k); return g?g.label:k; }

function cellHtml(t){
  const tt=esc(t.table).replace(/'/g,"\\'");
  const sg=t.src_grp||ACTIVE;
  let cls="",badge="",btn="";
  if(!t.in_use){ badge=`<span class="badge-sm b-free">● 사용 가능</span>`; btn=`<button class="btn-sm primary" onclick="start('${tt}','${sg}')">시작</button>`; }
  else if(t.user_email===ME.email){ cls="mine"; badge=`<span class="badge-sm b-me" title="내가 사용 중 · 경과 ${t.elapsed}">👤 ${esc(t.user_name)}</span>`; btn=`<button class="btn-sm" onclick="finish('${tt}','${sg}')">종료</button>`; }
  else { cls="busy"; badge=`<span class="badge-sm b-busy" title="사용 중 · 경과 ${t.elapsed}">👤 ${esc(t.user_name)}</span>`; btn = ME.is_admin?`<button class="btn-sm" onclick="finish('${tt}','${sg}')">강제종료</button>`:``; }
  const rm = (groupKind(ACTIVE)==='dept') ? `<button class="btn-x" title="이 탭에서 빼기" onclick="removeFav('${tt}','${sg}')">✕</button>` : "";
  return `<div class="cell ${cls}"><div class="top"><div class="nm" title="${esc(t.table)}">${fmtNameCell(t.table)}</div>${rm}</div><div class="bot">${badge}${btn}</div></div>`;
}

/* ---------- 부서 탭: 파일 담기 모달 ---------- */
function openPicker(){ const s=$("#pickerSearch"); if(s) s.value=""; $("#picker").classList.add("show"); renderPicker(); }
function closePicker(){ $("#picker").classList.remove("show"); }
function availableForDept(dept){
  const pool=[];
  GROUPS_DATA.filter(g=>g.kind==="sync").forEach(g=> g.tables.forEach(t=> pool.push({table:t.table, src_grp:g.key, srcLabel:g.label})));
  const dg=GROUPS_DATA.find(g=>g.key===dept);
  const have=new Set((dg?dg.tables:[]).map(t=> (t.src_grp||"")+"|"+t.table));
  return pool.filter(p=> !have.has(p.src_grp+"|"+p.table));
}
function renderPicker(){
  const dept=ACTIVE;
  const q=(($("#pickerSearch")||{}).value||"").trim().toLowerCase();
  let items=availableForDept(dept);
  if(q) items=items.filter(p=> p.table.toLowerCase().includes(q));
  items.sort((a,b)=> String(a.table).split("/").pop().toLowerCase().localeCompare(String(b.table).split("/").pop().toLowerCase()));
  const tt=$("#pickerTitle"); if(tt) tt.textContent=`파일 담기 · ${labelOf(dept)}`;
  const box=$("#pickerList"); if(!box) return;
  box.innerHTML = items.length ? items.slice(0,400).map(p=>{
    const t=esc(p.table).replace(/'/g,"\\'");
    return `<div class="pick"><div class="pn" title="${esc(p.table)}">${fmtNameCell(p.table)}</div><span class="src">${esc(p.srcLabel)}</span><button class="btn-sm primary" onclick="addFav('${t}','${p.src_grp}')">담기</button></div>`;
  }).join("") : `<div class="s-empty" style="padding:16px">담을 수 있는 파일이 없습니다(이미 다 담겼거나 목록 없음)</div>`;
}
async function addFav(table, srcGrp){
  const r=await fetch("/api/fav/add",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({dept:ACTIVE,src_grp:srcGrp,table_name:table})});
  if(!r.ok){const d=await r.json();toast(esc(d.error||"담기 실패"));return;}
  await refresh(); renderPicker();
}
async function removeFav(table, srcGrp){
  const r=await fetch("/api/fav/remove",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({dept:ACTIVE,src_grp:srcGrp,table_name:table})});
  if(!r.ok){const d=await r.json();toast(esc(d.error||"빼기 실패"));return;}
  refresh();
}

// 탭 전환/최초 1회: 고정 뼈대(검색창 포함)를 만든다. 이후 새로고침은 renderDynamic 만 갱신 → 검색창 포커스 유지.
function renderTabStructure(){
  const g=GROUPS_DATA.find(x=>x.key===ACTIVE)||GROUPS_DATA[0];
  const box=$("#tab"); if(!box) return;
  if(!g){ box.innerHTML=""; return; }
  const adminBar = (ME.is_admin && g.kind==='sync') ? `
    <div class="bar">
      <label>SVN Repo 주소 (${esc(g.label)})</label>
      <input id="svn" placeholder="svn://..." style="flex:1;min-width:240px">
      <button class="btn" onclick="saveSvn()">저장</button>
      <span class="pill" id="svnMsg">관리자만 수정 · 목록은 동기화(bat)로 채워집니다</span>
    </div>` : "";
  box.innerHTML=`${adminBar}
    <div class="bar">
      <label>🔎 검색</label>
      <input id="search" placeholder="파일명 입력…" style="flex:1;min-width:200px" oninput="onSearch(this.value)" autocomplete="off">
      <span class="pill" id="searchInfo"></span>
    </div>
    <div class="summary" id="summary"></div>
    <div class="grid" id="grid"></div>
    <div class="foot" id="foot"></div>`;
  const si=$("#search"); if(si) si.value=SEARCH;
  SVN_LOADED[ACTIVE]=false;
}

function renderDynamic(){
  const g=GROUPS_DATA.find(x=>x.key===ACTIVE)||GROUPS_DATA[0]; if(!g) return;
  const inUse=g.tables.filter(t=>t.in_use);
  let sum=`<span class="s-title">현재 사용 중${inUse.length?(" · "+inUse.length):""}</span>`;
  if(!inUse.length) sum+=`<span class="s-empty">사용 중인 테이블이 없습니다</span>`;
  else sum+=inUse.map(t=>{const file=String(t.table).split("/").pop();
    return `<span class="s-chip ${t.user_email===ME.email?'me':''}" title="${esc(t.table)}">👤 ${esc(t.user_name)}<span class="s-file">· ${esc(file)}</span></span>`;}).join("");
  const sm=$("#summary"); if(sm) sm.innerHTML=sum;
  const q=(SEARCH||"").trim().toLowerCase();
  let list=g.tables;
  if(q){
    list=g.tables.filter(t=>String(t.table).toLowerCase().includes(q));
    list.sort((a,b)=>{
      const an=String(a.table).split("/").pop().toLowerCase(), bn=String(b.table).split("/").pop().toLowerCase();
      const ap=an.startsWith(q)?0:1, bp=bn.startsWith(q)?0:1;
      return (ap-bp) || an.localeCompare(bn);
    });
  }
  const grid=$("#grid");
  if(grid){
    let inner = list.map(cellHtml).join("");
    if(groupKind(ACTIVE)==='dept') inner += `<div class="cell addcard" onclick="openPicker()" title="파일 담기"><div class="plus">+</div></div>`;
    grid.innerHTML = inner || `<div class="s-empty" style="padding:10px 4px">검색 결과가 없습니다</div>`;
  }
  const info=$("#searchInfo"); if(info) info.textContent = q ? `${list.length} / ${g.tables.length}` : `${g.tables.length}개`;
  const foot=$("#foot"); if(foot) foot.textContent = g.svn_repo_url?("SVN: "+g.svn_repo_url):"";
  if(ME.is_admin){ const el=$("#svn"); if(el && !SVN_LOADED[ACTIVE]){ el.value=g.svn_repo_url||""; SVN_LOADED[ACTIVE]=true; } }
}

async function refresh(){
  if(!ME) return;
  const r=await fetch("/api/status");
  if(r.status===401){ ME=null; renderLogin(); return; }
  const d=await r.json();
  GROUPS_DATA=d.groups||[];
  if(!GROUPS_DATA.find(g=>g.key===ACTIVE) && GROUPS_DATA[0]) ACTIVE=GROUPS_DATA[0].key;
  renderTabs();
  if(!$("#grid")) renderTabStructure();
  renderDynamic();
}

async function start(table, grp){
  const r=await fetch("/api/start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({table,group:grp||ACTIVE})});
  if(r.status===409){const d=await r.json();
    toast(`⚠️ <b>${esc(table)}</b> 은(는) 이미 <b>${esc(d.holder.user_name)}</b>님이 사용 중입니다 (경과 ${d.holder.elapsed}).`);}
  refresh();
}
async function finish(table, grp){
  const r=await fetch("/api/finish",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({table,group:grp||ACTIVE})});
  if(!r.ok){const d=await r.json();toast(esc(d.error||"종료 실패"));}
  refresh();
}
async function saveSvn(){
  const v=($("#svn").value||"").trim();
  const r=await fetch("/api/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({group:ACTIVE,svn_repo_url:v})});
  const d=await r.json();
  const m=$("#svnMsg"); if(m){ m.textContent = r.ok && d.ok ? "저장됨 ✓" : (d.error||"저장 실패");
    setTimeout(()=>{ if($("#svnMsg")) $("#svnMsg").textContent="관리자만 수정 · 목록은 동기화(bat)로 채워집니다"; },2600); }
}
async function logout(){ await fetch("/api/logout"); ME=null; SVN_LOADED={}; if(window.google&&google.accounts) google.accounts.id.disableAutoSelect(); renderLogin(); }

function startPoll(){ stopPoll(); POLL=setInterval(refresh,3000); }
function stopPoll(){ if(POLL) clearInterval(POLL); POLL=null; }
boot();
</script>
</body></html>
